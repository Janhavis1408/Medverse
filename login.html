<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | MedVerse</title>

    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <div class="login-container">


        <!-- ==========================================
             LEFT PANEL
        ========================================== -->

        <div class="left-panel">


            <div class="logo">

                <i class="fa-solid fa-heart-pulse"></i>

                <h1>MedVerse</h1>

            </div>


            <h2>

                Welcome Back 👋

            </h2>


            <p>

                Your AI Healthcare Companion is ready
                to help you.

                Login to continue your health journey.

            </p>


            <img
                src="images/doctor/doctor.png"
                alt="AI Doctor"
                onerror="this.style.display='none';">


        </div>



        <!-- ==========================================
             RIGHT PANEL
        ========================================== -->

        <div class="right-panel">


            <div class="login-box">


                <h2>

                    Login

                </h2>


                <p>

                    Access your MedVerse account

                </p>



                <!-- ==========================================
                     LOGIN FORM
                ========================================== -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="input-box">

                        <label for="email">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-box">

                        <label for="password">

                            Password

                        </label>


                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    </div>



                    <!-- ==========================================
                         OPTIONS
                    ========================================== -->

                    <div class="options">


                        <label>

                            <input
                                type="checkbox"
                                id="rememberMe">

                            Remember Me

                        </label>


                        <a
                            href="#"
                            id="forgotPassword">

                            Forgot Password?

                        </a>


                    </div>



                    <!-- ==========================================
                         LOGIN MESSAGE
                    ========================================== -->

                    <div
                        id="loginMessage"
                        style="
                            display:none;
                            margin:12px 0;
                            padding:10px;
                            border-radius:8px;
                            font-size:14px;
                            text-align:center;
                        ">

                    </div>



                    <!-- ==========================================
                         LOGIN BUTTON
                    ========================================== -->

                    <button
                        type="submit"
                        class="login-btn"
                        id="loginButton">

                        Login

                    </button>


                </form>



                <!-- ==========================================
                     DIVIDER
                ========================================== -->

                <div class="divider">

                    OR

                </div>



                <!-- ==========================================
                     GOOGLE LOGIN
                ========================================== -->

                <div class="social-login">


                    <button
                        type="button"
                        id="googleLogin">

                        <i class="fa-brands fa-google"></i>

                        Continue with Google

                    </button>


                </div>



                <!-- ==========================================
                     SIGNUP
                ========================================== -->

                <div class="signup-link">

                    Don't have an account?


                    <a href="signup.html">

                        Sign Up

                    </a>


                </div>



                <!-- ==========================================
                     HOME
                ========================================== -->

                <div class="back-home">


                    <a href="index.html">

                        ← Back to Home

                    </a>


                </div>


            </div>


        </div>


    </div>



    <!-- ==========================================
         LOGIN JAVASCRIPT
    ========================================== -->

    <script>


        // ==========================================
        // GET ELEMENTS
        // ==========================================

        const loginForm =
            document.getElementById("loginForm");


        const loginButton =
            document.getElementById("loginButton");


        const loginMessage =
            document.getElementById("loginMessage");


        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        const rememberMe =
            document.getElementById("rememberMe");



        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(
            message,
            success = false
        ) {


            loginMessage.style.display =
                "block";


            loginMessage.textContent =
                message;


            if (success) {


                loginMessage.style.background =
                    "#dcfce7";


                loginMessage.style.color =
                    "#166534";


            } else {


                loginMessage.style.background =
                    "#fee2e2";


                loginMessage.style.color =
                    "#991b1b";


            }

        }



        // ==========================================
        // LOAD REMEMBERED EMAIL
        // ==========================================

        const savedEmail =
            localStorage.getItem(
                "medverseRememberedEmail"
            );


        if (savedEmail) {


            emailInput.value =
                savedEmail;


            rememberMe.checked =
                true;


        }



        // ==========================================
        // LOGIN
        // ==========================================

        loginForm.addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();



                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;



                // ==========================================
                // BASIC VALIDATION
                // ==========================================

                if (!email || !password) {


                    showMessage(
                        "Please enter your email and password."
                    );


                    return;


                }



                // ==========================================
                // BUTTON LOADING
                // ==========================================

                loginButton.disabled =
                    true;


                loginButton.textContent =
                    "Logging in...";



                try {


                    // ==========================================
                    // SEND LOGIN REQUEST
                    // ==========================================

                    const response =
                        await fetch(
                            "http://localhost:3000/api/login",
                            {


                                method: "POST",


                                headers: {


                                    "Content-Type":
                                        "application/json"


                                },


                                body: JSON.stringify({


                                    email:
                                        email,


                                    password:
                                        password


                                })


                            }
                        );



                    const data =
                        await response.json();



                    // ==========================================
                    // LOGIN FAILED
                    // ==========================================

                    if (!response.ok) {


                        showMessage(
                            data.message ||
                            "Invalid email or password."
                        );


                        loginButton.disabled =
                            false;


                        loginButton.textContent =
                            "Login";


                        return;


                    }



                    // ==========================================
                    // REMEMBER ME
                    // ==========================================

                    if (rememberMe.checked) {


                        localStorage.setItem(
                            "medverseRememberedEmail",
                            email
                        );


                    } else {


                        localStorage.removeItem(
                            "medverseRememberedEmail"
                        );


                    }



                    // ==========================================
                    // SAVE CURRENT USER
                    // ==========================================

                    if (data.user) {


                        localStorage.setItem(
                            "medverseUser",
                            JSON.stringify(
                                data.user
                            )
                        );


                    }



                    // ==========================================
                    // SUCCESS MESSAGE
                    // ==========================================

                    showMessage(
                        "Login successful! Opening MedVerse...",
                        true
                    );



                    // ==========================================
                    // REDIRECT
                    // ==========================================

                    setTimeout(
                        function () {


                            window.location.href =
                                "dashboard.html";


                        },
                        800
                    );


                }


                catch (error) {


                    console.error(
                        "Login error:",
                        error
                    );


                    showMessage(
                        "Cannot connect to MedVerse server. Make sure server.js is running."
                    );


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "Login";


                }


            }
        );



        // ==========================================
        // FORGOT PASSWORD
        // ==========================================

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                function (event) {


                    event.preventDefault();


                    alert(
                        "Password recovery will be added later."
                    );


                }
            );



        // ==========================================
        // GOOGLE LOGIN
        // ==========================================

        document
            .getElementById("googleLogin")
            .addEventListener(
                "click",
                function () {


                    alert(
                        "Google Login will be added later."
                    );


                }
            );


    </script>


</body>

</html>
